    print_diagnostics: true
    debug: false
    publish_tf: true
    predict_to_current_time: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: map

    odom0: /Odometry
    odom0_config: [true, true, false,
                  false, false, true,
                  false,  false,  false,
                  false, false, false,
                  false, false, false]
    odom0_queue_size: 10
    odom0_nodelay: true
    odom0_differential: true
