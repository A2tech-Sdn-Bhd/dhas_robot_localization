navsat_transform:
  ros__parameters:
    frequency: 30.0
    delay: 0.0                 # 3.0 adds 3s lag; set 0 unless you really need it
    magnetic_declination_radians: 0.0
    yaw_offset: 0.0
    zero_altitude: true
    publish_filtered_gps: true
    use_odometry_yaw: false
    wait_for_datum: false
    use_sim_time: true         # or false everywhere if on real robot
    use_local_cartesian: false
    broadcast_utm_transform: true
    broadcast_utm_transform_as_parent_frame: true
